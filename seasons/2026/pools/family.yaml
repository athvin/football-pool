# =============================================================================
# THE FAMILY POOL — 2026
# =============================================================================
# One pool: who is in it, what it costs, and who picked what. How points are
# scored is ../rules.yaml, shared with every other pool playing this season —
# nothing in this file can change the math.
#
# The filename is the pool's slug, and the slug is its URL. Renaming this file
# moves the pool's whole address space, so don't.
# =============================================================================

name: Family Pool

# Served at the site root rather than at /family/. Exactly one pool per season
# sets this. Moving it is a one-way door: every link anyone has ever pasted
# into the group chat points here.
root: true

# Money. The pot is never written down — it is always len(entrants) * entry_fee,
# so it stays correct as picks trickle in.
entry_fee: 10.0
payout_split: [0.50, 0.30, 0.20] # 1st / 2nd / 3rd share of the pot
picks_per_entrant: 4

# Where the entry fee goes. Rendered on the rules page as a big QR code plus
# the link itself, so nobody has to ask how to pay.
venmo: https://venmo.com/u/Brian-Moore-4

# =============================================================================
# ENTRANTS AND THEIR PICKS
# =============================================================================
# Everyone picks exactly 4 teams for the whole season.
#
# The build validates this file hard and FAILS LOUDLY on any problem, because a
# silent typo here would just make someone score zero for a team all year:
#   - exactly 4 teams per entrant
#   - every code must be one of the 32 in rules.yaml (KAN is not KC)
#   - no duplicate team within a single entry
#   - no duplicate entrant name
#
# Team codes (use these exactly):
#   AFC East   NE  BUF MIA NYJ      NFC East   PHI DAL WAS NYG
#   AFC North  BAL PIT CIN CLE      NFC North  DET GB  MIN CHI
#   AFC South  JAX HOU IND TEN      NFC South  CAR TB  ATL NO
#   AFC West   KC  LAC DEN LV       NFC West   SEA LAR SF  ARI
#
# Note: the Rams are LAR here (upstream data calls them LA; we normalize).
# =============================================================================

entrants:
  - name: Brian Moore
    teams: ["KC", "BAL", "DAL", "CIN"]

  - name: Paul Moore
    teams: ["DET", "BUF", "SF", "NE"]

  - name: Brenda Moore
    teams: ["TB", "BUF", "CHI", "BAL"]

  # One entry, shared three ways.
  - name: "Shannon (plus Si & Rachel)"
    teams: ["DET", "CIN", "PHI", "BAL"]

  - name: Eric Riggs
    teams: ["WAS", "KC", "NYG", "CIN"]

  - name: "Asher O'Hara"
    teams: ["BAL", "CIN", "KC", "BUF"]

  # Two entries, not a typo — one household, two sets of picks, two entry fees.
  - name: "Zac + Sammy #1"
    teams: ["KC", "CIN", "BAL", "DAL"]

  - name: "Zac + Sammy #2"
    teams: ["DET", "NYG", "WAS", "BUF"]

  - name: Eli
    teams: ["LAR", "SEA", "KC", "NE"]

  - name: Jerry
    teams: ["DET", "DAL", "BUF", "KC"]

  - name: Linda
    teams: ["LAR", "PHI", "DEN", "BAL"]

  - name: Dave Moore
    teams: ["KC", "BAL", "DAL", "NYG"]

  # As family members send in their picks, add them here — nothing else in the
  # project needs to change. The pot, the payouts, and every pool-relative
  # metric recompute from however many entrants are in this list.
  #
  # - name: Aunt Carol
  #   teams: [CIN, WAS, TEN, NO]
