name: CI

# Everything that must be true before code reaches main.
#
# `daily.yml` also runs the tests, but it runs them *after* the merge — by
# which point a regression is already the live scoreboard until the next
# scheduled run. This workflow is the gate that runs first, and the branch
# ruleset on main requires all three jobs below to pass before a pull request
# can be merged.
#
# Only `pull_request`, deliberately. Adding `push: branches-ignore: [main]` as
# well looks like it gives you earlier feedback, but once a branch has a pull
# request open both events fire and every check runs twice — two entries per
# job in the checks list, and both have to go green before the merge button
# unlocks. `pull_request` alone is the gate that matters; use `gh workflow run
# ci.yml --ref <branch>` if you want a run before opening one.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch makes the previous run's answer irrelevant. Unlike the
# Pages deploy, cancelling one of these mid-flight costs nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    # ubuntu-24.04-arm rather than ubuntu-latest: free for public repos, and
    # its 4 vCPUs are 4 physical Cobalt 100 cores where ubuntu-latest's are 2
    # SMT'd x64 cores — this suite's 4-worker speedup measured only 2.2x on
    # x64, the SMT signature. Pure uv job, and every dependency ships aarch64
    # wheels. The javascript job stays on x64: at 9 seconds warm there is
    # nothing to win.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # cache-python keeps the managed CPython that .python-version pins from
      # being re-downloaded every run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        run: uv sync --frozen

      # pyproject sets --cov-fail-under=95, so this fails on a coverage drop as
      # well as on a broken test.
      #
      # `-n auto` is the whole reason this job is seconds rather than minutes:
      # the render tests are CPU-bound work xdist fans out across the runner's
      # four vCPUs. Most of them read from shared module-scoped site builds
      # now, which instantiate once per worker — still cheaper than once per
      # test by an order of magnitude. `--dist worksteal` over the default
      # `load` because per-test cost ranges from milliseconds to seconds and
      # an idle worker should steal from a loaded one.
      #
      # `--no-sync` because sync already ran two steps up — re-verifying the
      # lock inside `uv run` measured 2.3 seconds of nothing.
      #
      # pytest-cov combines the per-worker coverage data itself, so the
      # threshold above still sees the whole suite — the reported number is
      # identical to a serial run.
      - name: Tests and coverage
        env:
          # coverage 7.15+ picks the fast sys.monitoring core on 3.14+ by
          # default (.python-version pins 3.14). Naming it explicitly turns any
          # regression loud: an interpreter that can't do branch coverage under
          # sysmon prints "Can't use core=sysmon" instead of silently falling
          # back to the ~2x-slower ctrace core — which is exactly what CI was
          # doing on the runner's system 3.12 before the pin.
          COVERAGE_CORE: sysmon
        run: uv run --no-sync pytest -n auto --dist worksteal

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `cache: npm` above only restores ~/.npm, the download cache. That saves
      # the network but not the install: npm still has to relink 156 packages
      # into node_modules, which measured at 3m34s on a warm cache against 3s of
      # actual tests. Caching the built node_modules instead skips that entirely.
      #
      # package-lock.json pins every version, so it alone determines the tree —
      # but only for a fixed platform, because some of these packages ship
      # prebuilt native binaries. Hence os, arch and node version in the key:
      # runner.os says "Linux" on both the x64 and arm runners, so os alone
      # would hand an arm job x64 binaries, and a bumped node-version would
      # hand this job binaries built for the old runtime.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Tests and coverage
        run: npx vitest run --coverage

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        run: uv sync --frozen

      # --offline builds from the committed results file, so this check is
      # deterministic and does not fail because nflverse happened to be slow.
      # The real fetch is daily.yml's job.
      #
      # Both base paths are built because they fail in opposite situations: a
      # root-absolute asset URL works perfectly at / and 404s only once it is
      # deployed under /football-pool/, which is exactly the bug a local
      # preview cannot show you.
      - name: Build at the site root
        run: uv run --no-sync pool build --out ./public-root --base "" --offline

      - name: Build at the project path
        run: uv run --no-sync pool build --out ./public-project --base "/football-pool" --offline

      # The regex, rather than a plain substring, so a malformed or missing
      # cache-busting stamp fails here too — an asset URL is only correct if it
      # carries both the deployment prefix and the content fingerprint.
      - name: Check the base path and fingerprint reached the markup
        run: |
          set -euo pipefail
          grep -qE 'href="/assets/site\.css\?v=[0-9a-f]{8}"' public-root/index.html
          grep -qE 'href="/football-pool/assets/site\.css\?v=[0-9a-f]{8}"' public-project/index.html
          grep -qE 'src="/football-pool/assets/site\.js\?v=[0-9a-f]{8}"' public-project/index.html
          test -f public-project/rules/index.html
          test -f public-project/schedule/index.html
          test -f public-project/data/standings.json

          # The second pool is a whole site of its own, one level down...
          test -f public-project/friends/index.html
          test -f public-project/friends/rules/index.html
          test -f public-project/friends/data/standings.json

          # ...but /assets/ belongs to the SITE, not the pool. A pool-relative
          # asset URL 404s in production and nowhere else, which is precisely
          # the class of bug this whole step exists to catch.
          grep -qE 'href="/football-pool/assets/site\.css\?v=[0-9a-f]{8}"' public-project/friends/index.html
          grep -qE 'src="/football-pool/assets/site\.js\?v=[0-9a-f]{8}"' public-project/friends/index.html
          test ! -e public-project/friends/assets

          # Conversely, a page URL must stay inside its pool: site-relative here
          # would send the friends nav to the family pool's board.
          grep -q 'href="/football-pool/friends/rules/"' public-project/friends/index.html

          # No root-absolute URL on the nested page escapes the deployment
          # prefix. `test -z "$(...)"` rather than a negated pipeline: under
          # pipefail the nothing-found case exits non-zero from the FIRST grep,
          # which reads backwards.
          test -z "$(grep -oE '(href|src)="/[^"]*"' public-project/friends/index.html \
                     | grep -v '="/football-pool/' || true)"

          # The pools are sealed off from each other: no page in one links to
          # the other, so nobody lands on a roster that has no idea who they
          # are. The family pool did not move — it still owns the site root.
          ! grep -q 'href="/football-pool/friends/' public-project/index.html
          ! grep -q 'href="/football-pool/"' public-project/friends/index.html
          grep -q 'Family Pool' public-project/index.html
          grep -q 'Friends Pool' public-project/friends/index.html
          ! grep -q 'Friends Pool' public-project/index.html
          ! grep -q 'Family Pool' public-project/friends/index.html

          # The root build too, where an empty prefix hides a bug differently.
          grep -qE 'href="/assets/site\.css\?v=[0-9a-f]{8}"' public-root/friends/index.html

          echo 'both pools render at both base paths, assets shared and fingerprinted'
